name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request:
    paths:
      - ".github/labels.yml"
  push:
    branches: [dev]
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

jobs:
  # Applies version:*/area:* labels to a PR based on which files it touches.
  pr-labeler:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false

  # Previews the label-set diff when a PR touches labels.yml, without
  # applying anything -- lets a reviewer see the effect before it merges.
  preview-label-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          dry-run: true

  # Keeps the repo's actual label set (names/colors/descriptions) in sync
  # with .github/labels.yml once a change lands on dev.
  sync-labels:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
