# Config for actions/labeler, run by .github/workflows/labeler.yml.
# Only covers what's honestly derivable from a file path today. The
# `area:*` v2-phase labels (bootstrap, update, prefix-setup, etc.) stay
# manual until src/wand_launcher/ grows the subpackages docs/ARCHITECTURE.md
# describes -- right now it's just entrypoint.py, so there's no path to
# glob against per-phase without guessing.
#
# Note on branches: on `dev` the v1 layout is what exists, so only the
# version:v1-legacy glob (and README/CONTRIBUTING for area:docs) can match.
# The v2 paths below -- src/wand_launcher/**, docs/ARCHITECTURE.md,
# docs/GOALS.md, AGENTS.md, .pre-commit-config.yaml -- live on rewrite/v2
# and only start firing once this is cherry-picked there.

"version:v1-legacy":
  - changed-files:
      - any-glob-to-any-file: "src/*.py"

"version:v2-rewrite":
  - changed-files:
      - any-glob-to-any-file:
          - "src/wand_launcher/**"
          - "docs/ARCHITECTURE.md"
          - "docs/GOALS.md"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "CONTRIBUTING.md"
          - "AGENTS.md"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          # Label-config changes are repo maintenance too -- without these
          # a PR that only touches labels.yml/labeler.yml gets no area label.
          - ".github/labeler.yml"
          - ".github/labels.yml"
          - ".pre-commit-config.yaml"
